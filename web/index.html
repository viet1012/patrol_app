<!DOCTYPE html>
<html>
<head>
    <base href="/"/>

    <meta charset="UTF-8"/>
    <meta content="IE=Edge" http-equiv="X-UA-Compatible"/>
    <meta content="Flutter Web QR Camera" name="description"/>

    <meta content="yes" name="mobile-web-app-capable"/>
    <meta content="black" name="apple-mobile-web-app-status-bar-style"/>
    <meta content="S-Patrol" name="apple-mobile-web-app-title"/>
    <meta content="__APP_VERSION__" name="app-version">
    <link href="icons/favicon-192.png" rel="apple-touch-icon"/>

    <link href="favicon.png" rel="icon" type="image/png"/>

    <style>
        @font-face {
          font-family: "Roboto";
          src: url("assets/fonts/Roboto/Roboto-VariableFont_wdth.ttf")
            format("truetype");
        }
        body {
          font-family: "Roboto", sans-serif;
        }
    </style>

    <title>S-Patrol</title>
    <link href="manifest.json" rel="manifest"/>
</head>

<body>

<!-- ZXing UMD -->
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
<script>
    (function () {
      "use strict";

      // ============================================================
      // CONFIG
      // ============================================================

      /*
       * 130 ms ~= 7–8 lần decode/giây.
       * Nhanh đủ cho trải nghiệm thực tế nhưng không quá nóng máy.
       */
      const FAST_INTERVAL_MS = 130;

      /*
       * Hard mode mở rộng ROI và tăng kích thước decode.
       */
      const HARD_INTERVAL_MS = 220;

      /*
       * Sau khoảng thời gian này không tìm thấy QR thì chuyển hard mode.
       */
      const SWITCH_TO_HARD_AFTER_MS = 1100;

      /*
       * Sau khi bắt được QR, giữ hard một khoảng ngắn rồi về fast.
       */
      const HARD_SUCCESS_HOLD_MS = 450;

      /*
       * Không gửi lại cùng QR quá nhanh.
       */
      const DUPLICATE_COOLDOWN_MS = 1200;

      /*
       * Cùng một text phải xuất hiện liên tục N frame.
       * 2 là mức cân bằng tốt giữa tốc độ và độ chính xác.
       */
      const REQUIRED_STABLE_COUNT = 2;

      /*
       * ROI ở giữa camera.
       */
      const FAST_ROI_SCALE = 0.68;
      const HARD_ROI_SCALE = 0.94;

      /*
       * Giới hạn kích thước frame decode.
       */
      const FAST_MAX_SCAN_EDGE = 720;
      const HARD_MAX_SCAN_EDGE = 900;

      /*
       * Ảnh upload tối đa.
       */
      const UPLOAD_MAX_EDGE = 1600;

      /*
       * Độ dài QR tối thiểu/tối đa để tránh dữ liệu bất thường.
       */
      const MIN_QR_LENGTH = 1;
      const MAX_QR_LENGTH = 2048;

      // ============================================================
      // STATE
      // ============================================================

      let loopRunning = false;
      let loopTimer = null;
      let decoding = false;

      let mode = "fast";
      let scanStartedAt = 0;
      let lastSuccessAt = 0;
      let lastAttemptAt = 0;

      let lastEmittedText = "";
      let lastEmittedAt = 0;

      let stableText = "";
      let stableCount = 0;

      let canvas = null;
      let context = null;

      let qrReader = null;
      let browserQrReader = null;

      // ============================================================
      // EVENT BRIDGE
      // ============================================================

      function dispatchJsonEvent(eventName, payload) {
        try {
          const json = JSON.stringify(payload || {});

          window.dispatchEvent(
            new CustomEvent(eventName, {
              detail: json
            })
          );
        } catch (error) {
          console.error("[QR] dispatchJsonEvent error:", error);
        }
      }

      function dispatchCameraResult(text, error = "") {
        dispatchJsonEvent("qr-from-image", {
          text: String(text || ""),
          error: String(error || "")
        });
      }

      function dispatchUploadResult(text, error = "") {
        dispatchJsonEvent("qr-from-uploaded-image", {
          text: String(text || ""),
          error: String(error || "")
        });
      }

      // ============================================================
      // HELPERS
      // ============================================================

      function now() {
        return Date.now();
      }

      function normalizeQr(value) {
        if (value === null || value === undefined) {
          return "";
        }

        return String(value).trim();
      }

      function isValidQrText(text) {
        return (
          text.length >= MIN_QR_LENGTH &&
          text.length <= MAX_QR_LENGTH
        );
      }

      function getVideoElement() {
        const video = document.getElementById("qr-video");

        if (!(video instanceof HTMLVideoElement)) {
          throw new Error("Video element #qr-video not found.");
        }

        if (!video.srcObject) {
          throw new Error("Camera stream is not ready.");
        }

        if (
          video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA ||
          video.videoWidth <= 0 ||
          video.videoHeight <= 0
        ) {
          throw new Error("Camera video is not ready.");
        }

        return video;
      }

      function ensureCanvas(width, height) {
        if (!canvas) {
          canvas = document.createElement("canvas");

          context = canvas.getContext("2d", {
            alpha: false,
            willReadFrequently: true
          });
        }

        if (!context) {
          throw new Error("Cannot create canvas context.");
        }

        if (canvas.width !== width) {
          canvas.width = width;
        }

        if (canvas.height !== height) {
          canvas.height = height;
        }

        return canvas;
      }

      function resizeInsideMaxEdge(width, height, maxEdge) {
        if (width <= 0 || height <= 0) {
          return {
            width: 0,
            height: 0
          };
        }

        const longest = Math.max(width, height);

        if (longest <= maxEdge) {
          return {
            width,
            height
          };
        }

        const scale = maxEdge / longest;

        return {
          width: Math.max(1, Math.round(width * scale)),
          height: Math.max(1, Math.round(height * scale))
        };
      }

      function getCropRect(videoWidth, videoHeight) {
        const roiScale =
          mode === "hard"
            ? HARD_ROI_SCALE
            : FAST_ROI_SCALE;

        const cropWidth = Math.max(
          1,
          Math.floor(videoWidth * roiScale)
        );

        const cropHeight = Math.max(
          1,
          Math.floor(videoHeight * roiScale)
        );

        return {
          sx: Math.floor((videoWidth - cropWidth) / 2),
          sy: Math.floor((videoHeight - cropHeight) / 2),
          sw: cropWidth,
          sh: cropHeight
        };
      }

      function currentInterval() {
        return mode === "hard"
          ? HARD_INTERVAL_MS
          : FAST_INTERVAL_MS;
      }

      function currentMaxScanEdge() {
        return mode === "hard"
          ? HARD_MAX_SCAN_EDGE
          : FAST_MAX_SCAN_EDGE;
      }

      function switchMode(nextMode) {
        if (nextMode !== "fast" && nextMode !== "hard") {
          return;
        }

        if (mode === nextMode) {
          return;
        }

        mode = nextMode;

        console.debug("[QR] mode =", mode);
      }

      // ============================================================
      // ZXING
      // ============================================================

      function createHints(tryHarder) {
        try {
          const hints = new Map();

          if (
            ZXing.DecodeHintType &&
            ZXing.DecodeHintType.POSSIBLE_FORMATS &&
            ZXing.BarcodeFormat &&
            ZXing.BarcodeFormat.QR_CODE
          ) {
            hints.set(
              ZXing.DecodeHintType.POSSIBLE_FORMATS,
              [ZXing.BarcodeFormat.QR_CODE]
            );
          }

          if (
            ZXing.DecodeHintType &&
            ZXing.DecodeHintType.TRY_HARDER
          ) {
            hints.set(
              ZXing.DecodeHintType.TRY_HARDER,
              Boolean(tryHarder)
            );
          }

          if (
            ZXing.DecodeHintType &&
            ZXing.DecodeHintType.CHARACTER_SET
          ) {
            hints.set(
              ZXing.DecodeHintType.CHARACTER_SET,
              "UTF-8"
            );
          }

          return hints;
        } catch (_) {
          return null;
        }
      }

      function ensureReaders() {
        if (!window.ZXing) {
          throw new Error("ZXing library is not loaded.");
        }

        if (!qrReader) {
          try {
            qrReader = new ZXing.QRCodeReader();
          } catch (error) {
            console.warn("[QR] QRCodeReader unavailable:", error);
            qrReader = null;
          }
        }

        if (!browserQrReader) {
          try {
            browserQrReader =
              new ZXing.BrowserQRCodeReader(null, 0);
          } catch (error) {
            console.warn(
              "[QR] BrowserQRCodeReader unavailable:",
              error
            );

            browserQrReader = null;
          }
        }
      }

      function resetReader() {
        try {
          qrReader?.reset?.();
        } catch (_) {}

        try {
          browserQrReader?.reset?.();
        } catch (_) {}
      }

      async function decodeCanvasWithZxing(
        targetCanvas,
        tryHarder
      ) {
        ensureReaders();

        /*
         * Ưu tiên QRCodeReader core để kiểm soát hints.
         */
        if (
          qrReader &&
          ZXing.HTMLCanvasElementLuminanceSource &&
          ZXing.BinaryBitmap &&
          ZXing.HybridBinarizer
        ) {
          try {
            const source =
              new ZXing.HTMLCanvasElementLuminanceSource(
                targetCanvas
              );

            const bitmap =
              new ZXing.BinaryBitmap(
                new ZXing.HybridBinarizer(source)
              );

            const hints = createHints(tryHarder);

            if (hints && qrReader.setHints) {
              qrReader.setHints(hints);
            }

            const result = qrReader.decode(
              bitmap,
              hints || undefined
            );

            const text = normalizeQr(
              result?.text ?? result?.getText?.()
            );

            if (isValidQrText(text)) {
              return text;
            }
          } catch (_) {
            /*
             * NotFoundException là bình thường.
             * Tiếp tục fallback.
             */
          } finally {
            try {
              qrReader.reset?.();
            } catch (_) {}
          }
        }

        /*
         * Fallback BrowserQRCodeReader.
         */
        if (browserQrReader) {
          try {
            const result =
              await browserQrReader.decodeFromCanvas(
                targetCanvas
              );

            const text = normalizeQr(
              result?.text ?? result?.getText?.()
            );

            if (isValidQrText(text)) {
              return text;
            }
          } catch (_) {
            // Không tìm thấy QR trong frame.
          } finally {
            try {
              browserQrReader.reset?.();
            } catch (_) {}
          }
        }

        return "";
      }

      function decodeCanvasWithJsQr(
        targetCanvas,
        inversionAttempts = "attemptBoth"
      ) {
        if (typeof window.jsQR !== "function") {
          return "";
        }

        try {
          const targetContext =
            targetCanvas.getContext("2d", {
              willReadFrequently: true
            });

          if (!targetContext) {
            return "";
          }

          const imageData =
            targetContext.getImageData(
              0,
              0,
              targetCanvas.width,
              targetCanvas.height
            );

          const result = window.jsQR(
            imageData.data,
            targetCanvas.width,
            targetCanvas.height,
            {
              inversionAttempts
            }
          );

          const text = normalizeQr(result?.data);

          return isValidQrText(text) ? text : "";
        } catch (_) {
          return "";
        }
      }

      // ============================================================
      // CAMERA FRAME DECODE
      // ============================================================

      async function decodeCameraFrame(video) {
        const videoWidth = video.videoWidth || 0;
        const videoHeight = video.videoHeight || 0;

        if (videoWidth <= 0 || videoHeight <= 0) {
          return "";
        }

        const crop = getCropRect(
          videoWidth,
          videoHeight
        );

        const targetSize = resizeInsideMaxEdge(
          crop.sw,
          crop.sh,
          currentMaxScanEdge()
        );

        if (
          targetSize.width <= 0 ||
          targetSize.height <= 0
        ) {
          return "";
        }

        const targetCanvas = ensureCanvas(
          targetSize.width,
          targetSize.height
        );

        context.save();

        try {
          context.fillStyle = "#ffffff";
          context.fillRect(
            0,
            0,
            targetCanvas.width,
            targetCanvas.height
          );

          context.drawImage(
            video,
            crop.sx,
            crop.sy,
            crop.sw,
            crop.sh,
            0,
            0,
            targetCanvas.width,
            targetCanvas.height
          );
        } finally {
          context.restore();
        }

        /*
         * Pass 1: ZXing.
         */
        const zxingText =
          await decodeCanvasWithZxing(
            targetCanvas,
            mode === "hard"
          );

        if (zxingText) {
          return zxingText;
        }

        /*
         * Pass 2 chỉ chạy ở hard mode để không làm nặng máy.
         */
        if (mode === "hard") {
          const jsQrText =
            decodeCanvasWithJsQr(
              targetCanvas,
              "attemptBoth"
            );

          if (jsQrText) {
            return jsQrText;
          }
        }

        return "";
      }

      // ============================================================
      // STABILITY + DEDUPE
      // ============================================================

      function resetStability() {
        stableText = "";
        stableCount = 0;
      }

      function acceptStableText(text) {
        if (!text) {
          resetStability();
          return false;
        }

        if (stableText === text) {
          stableCount += 1;
        } else {
          stableText = text;
          stableCount = 1;
        }

        return stableCount >= REQUIRED_STABLE_COUNT;
      }

      function shouldEmit(text) {
        const timestamp = now();

        if (
          text === lastEmittedText &&
          timestamp - lastEmittedAt <
            DUPLICATE_COOLDOWN_MS
        ) {
          return false;
        }

        return true;
      }

      function emitDetectedQr(text) {
        const normalized = normalizeQr(text);

        if (!isValidQrText(normalized)) {
          return;
        }

        if (!acceptStableText(normalized)) {
          return;
        }

        if (!shouldEmit(normalized)) {
          return;
        }

        const timestamp = now();

        lastEmittedText = normalized;
        lastEmittedAt = timestamp;
        lastSuccessAt = timestamp;

        resetStability();

        dispatchCameraResult(normalized, "");

        /*
         * Sau khi thành công, quay về fast mode.
         */
        if (mode === "hard") {
          window.setTimeout(() => {
            if (loopRunning) {
              switchMode("fast");
              scanStartedAt = now();
            }
          }, HARD_SUCCESS_HOLD_MS);
        }
      }

      // ============================================================
      // ADAPTIVE MODE
      // ============================================================

      function updateAdaptiveMode() {
        const timestamp = now();

        const referenceTime =
          lastSuccessAt > 0
            ? lastSuccessAt
            : scanStartedAt;

        if (
          mode === "fast" &&
          timestamp - referenceTime >
            SWITCH_TO_HARD_AFTER_MS
        ) {
          switchMode("hard");
        }
      }

      // ============================================================
      // LOOP
      // ============================================================

      function scheduleNext(video) {
        if (!loopRunning) {
          return;
        }

        if (loopTimer !== null) {
          clearTimeout(loopTimer);
        }

        loopTimer = window.setTimeout(
          () => loopTick(video),
          16
        );
      }

      async function loopTick(video) {
        if (!loopRunning) {
          return;
        }

        /*
         * Nếu Flutter thay video element sau sleep/wake,
         * lấy lại element mới.
         */
        let activeVideo = video;

        try {
          const currentVideo =
            document.getElementById("qr-video");

          if (
            currentVideo instanceof HTMLVideoElement &&
            currentVideo !== video
          ) {
            activeVideo = currentVideo;
          }
        } catch (_) {}

        if (
          !activeVideo ||
          !activeVideo.srcObject ||
          activeVideo.videoWidth <= 0 ||
          activeVideo.videoHeight <= 0
        ) {
          scheduleNext(activeVideo);
          return;
        }

        const timestamp = now();

        if (
          decoding ||
          timestamp - lastAttemptAt <
            currentInterval()
        ) {
          scheduleNext(activeVideo);
          return;
        }

        lastAttemptAt = timestamp;
        decoding = true;

        try {
          updateAdaptiveMode();

          const text =
            await decodeCameraFrame(activeVideo);

          if (text) {
            emitDetectedQr(text);
          } else {
            /*
             * Không reset ngay mỗi frame vì QR có thể bị blur tạm thời.
             * Chỉ giảm voting khi chuỗi chưa đủ ổn định.
             */
            if (stableCount > 0) {
              stableCount = Math.max(
                0,
                stableCount - 1
              );

              if (stableCount === 0) {
                stableText = "";
              }
            }
          }
        } catch (error) {
          console.warn("[QR] loop decode error:", error);
        } finally {
          decoding = false;
          scheduleNext(activeVideo);
        }
      }

      // ============================================================
      // PUBLIC CAMERA API
      // ============================================================

      window.startQrLoop = function () {
        try {
          if (loopRunning) {
            return;
          }

          ensureReaders();

          const video = getVideoElement();

          loopRunning = true;
          decoding = false;

          mode = "fast";
          scanStartedAt = now();
          lastSuccessAt = 0;
          lastAttemptAt = 0;

          lastEmittedText = "";
          lastEmittedAt = 0;

          resetStability();

          console.info(
            "[QR] scanner started:",
            video.videoWidth,
            "x",
            video.videoHeight
          );

          scheduleNext(video);
        } catch (error) {
          loopRunning = false;

          const message =
            String(error?.message || error);

          console.error(
            "[QR] startQrLoop error:",
            error
          );

          dispatchCameraResult("", message);
        }
      };

      window.stopQrLoop = function () {
        loopRunning = false;
        decoding = false;

        if (loopTimer !== null) {
          clearTimeout(loopTimer);
          loopTimer = null;
        }

        resetStability();
        resetReader();

        console.info("[QR] scanner stopped");
      };

      // ============================================================
      // IMAGE HELPERS
      // ============================================================

      function loadImage(objectUrl) {
        return new Promise((resolve, reject) => {
          const image = new Image();

          image.onload = () => resolve(image);

          image.onerror = () => {
            reject(
              new Error("Failed to load image.")
            );
          };

          image.src = objectUrl;
        });
      }

      function createCanvasFromImage(
        image,
        maxEdge
      ) {
        const sourceWidth =
          image.naturalWidth ||
          image.width ||
          0;

        const sourceHeight =
          image.naturalHeight ||
          image.height ||
          0;

        if (
          sourceWidth <= 0 ||
          sourceHeight <= 0
        ) {
          throw new Error("Invalid image size.");
        }

        const targetSize = resizeInsideMaxEdge(
          sourceWidth,
          sourceHeight,
          maxEdge
        );

        const output =
          document.createElement("canvas");

        output.width = targetSize.width;
        output.height = targetSize.height;

        const outputContext =
          output.getContext("2d", {
            alpha: false,
            willReadFrequently: true
          });

        if (!outputContext) {
          throw new Error(
            "Cannot create image canvas."
          );
        }

        outputContext.fillStyle = "#ffffff";
        outputContext.fillRect(
          0,
          0,
          output.width,
          output.height
        );

        outputContext.drawImage(
          image,
          0,
          0,
          sourceWidth,
          sourceHeight,
          0,
          0,
          output.width,
          output.height
        );

        return output;
      }

      function createGrayscaleCanvas(sourceCanvas) {
        const output =
          document.createElement("canvas");

        output.width = sourceCanvas.width;
        output.height = sourceCanvas.height;

        const outputContext =
          output.getContext("2d", {
            alpha: false,
            willReadFrequently: true
          });

        if (!outputContext) {
          return null;
        }

        outputContext.drawImage(
          sourceCanvas,
          0,
          0
        );

        const imageData =
          outputContext.getImageData(
            0,
            0,
            output.width,
            output.height
          );

        const pixels = imageData.data;

        for (
          let index = 0;
          index < pixels.length;
          index += 4
        ) {
          const gray = Math.round(
            pixels[index] * 0.299 +
            pixels[index + 1] * 0.587 +
            pixels[index + 2] * 0.114
          );

          pixels[index] = gray;
          pixels[index + 1] = gray;
          pixels[index + 2] = gray;
        }

        outputContext.putImageData(
          imageData,
          0,
          0
        );

        return output;
      }

      function createHighContrastCanvas(
        sourceCanvas
      ) {
        const output =
          document.createElement("canvas");

        output.width = sourceCanvas.width;
        output.height = sourceCanvas.height;

        const outputContext =
          output.getContext("2d", {
            alpha: false,
            willReadFrequently: true
          });

        if (!outputContext) {
          return null;
        }

        outputContext.drawImage(
          sourceCanvas,
          0,
          0
        );

        const imageData =
          outputContext.getImageData(
            0,
            0,
            output.width,
            output.height
          );

        const pixels = imageData.data;

        /*
         * Contrast đơn giản, nhẹ hơn OpenCV.
         */
        const contrast = 1.45;
        const midpoint = 128;

        for (
          let index = 0;
          index < pixels.length;
          index += 4
        ) {
          const gray = Math.round(
            pixels[index] * 0.299 +
            pixels[index + 1] * 0.587 +
            pixels[index + 2] * 0.114
          );

          const adjusted = Math.max(
            0,
            Math.min(
              255,
              Math.round(
                (gray - midpoint) * contrast +
                midpoint
              )
            )
          );

          pixels[index] = adjusted;
          pixels[index + 1] = adjusted;
          pixels[index + 2] = adjusted;
        }

        outputContext.putImageData(
          imageData,
          0,
          0
        );

        return output;
      }

      function createCenterCropCanvas(
        sourceCanvas,
        scale = 0.82
      ) {
        const sourceWidth = sourceCanvas.width;
        const sourceHeight = sourceCanvas.height;

        const cropWidth =
          Math.max(
            1,
            Math.round(sourceWidth * scale)
          );

        const cropHeight =
          Math.max(
            1,
            Math.round(sourceHeight * scale)
          );

        const sx =
          Math.round(
            (sourceWidth - cropWidth) / 2
          );

        const sy =
          Math.round(
            (sourceHeight - cropHeight) / 2
          );

        const output =
          document.createElement("canvas");

        output.width = cropWidth;
        output.height = cropHeight;

        const outputContext =
          output.getContext("2d", {
            alpha: false,
            willReadFrequently: true
          });

        if (!outputContext) {
          return null;
        }

        outputContext.drawImage(
          sourceCanvas,
          sx,
          sy,
          cropWidth,
          cropHeight,
          0,
          0,
          cropWidth,
          cropHeight
        );

        return output;
      }

      async function decodeUploadedCanvas(
        targetCanvas
      ) {
        let text = "";

        /*
         * Pass 1: ZXing original.
         */
        text =
          await decodeCanvasWithZxing(
            targetCanvas,
            true
          );

        if (text) {
          return text;
        }

        /*
         * Pass 2: jsQR original.
         */
        text =
          decodeCanvasWithJsQr(
            targetCanvas,
            "attemptBoth"
          );

        if (text) {
          return text;
        }

        /*
         * Pass 3: center crop.
         */
        const centerCanvas =
          createCenterCropCanvas(
            targetCanvas,
            0.84
          );

        if (centerCanvas) {
          text =
            await decodeCanvasWithZxing(
              centerCanvas,
              true
            );

          if (text) {
            return text;
          }

          text =
            decodeCanvasWithJsQr(
              centerCanvas,
              "attemptBoth"
            );

          if (text) {
            return text;
          }
        }

        /*
         * Pass 4: grayscale.
         */
        const grayCanvas =
          createGrayscaleCanvas(
            targetCanvas
          );

        if (grayCanvas) {
          text =
            await decodeCanvasWithZxing(
              grayCanvas,
              true
            );

          if (text) {
            return text;
          }

          text =
            decodeCanvasWithJsQr(
              grayCanvas,
              "attemptBoth"
            );

          if (text) {
            return text;
          }
        }

        /*
         * Pass 5: high contrast.
         */
        const contrastCanvas =
          createHighContrastCanvas(
            targetCanvas
          );

        if (contrastCanvas) {
          text =
            await decodeCanvasWithZxing(
              contrastCanvas,
              true
            );

          if (text) {
            return text;
          }

          text =
            decodeCanvasWithJsQr(
              contrastCanvas,
              "attemptBoth"
            );

          if (text) {
            return text;
          }
        }

        return "";
      }

      // ============================================================
      // PUBLIC IMAGE API
      // ============================================================

      window.decodeQrFromImageBytes =
        async function (objectUrl) {
          try {
            if (!objectUrl) {
              throw new Error(
                "Image URL is empty."
              );
            }

            ensureReaders();

            const image =
              await loadImage(objectUrl);

            const imageCanvas =
              createCanvasFromImage(
                image,
                UPLOAD_MAX_EDGE
              );

            const text =
              await decodeUploadedCanvas(
                imageCanvas
              );

            if (text) {
              dispatchUploadResult(text, "");
            } else {
              dispatchUploadResult(
                "",
                "No QR code found in image."
              );
            }
          } catch (error) {
            console.error(
              "[QR-UPLOAD] decode error:",
              error
            );

            dispatchUploadResult(
              "",
              String(error?.message || error)
            );
          }
        };

      console.info("[QR] scanner script loaded");
    })();
</script>
