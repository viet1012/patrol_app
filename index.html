<script>
    (function () {
      "use strict";

      // ============================================================
      // CONFIG
      // ============================================================

      /*
       * 130 ms ~= 7–8 lần decode/giây.
       * Nhanh đủ cho trải nghiệm thực tế nhưng không quá nóng máy.
       */
      const FAST_INTERVAL_MS = 150;

      /*
       * Hard mode mở rộng ROI và tăng kích thước decode.
       */
      const HARD_INTERVAL_MS = 240;

      /*
       * Sau khoảng thời gian này không tìm thấy QR thì chuyển hard mode.
       */
      const SWITCH_TO_HARD_AFTER_MS = 800;

      /*
       * Sau khi bắt được QR, giữ hard một khoảng ngắn rồi về fast.
       */
      const HARD_SUCCESS_HOLD_MS = 450;

      /*
       * Không gửi lại cùng QR quá nhanh.
       */
      const DUPLICATE_COOLDOWN_MS = 1200;

      /*
       * Cùng một text phải xuất hiện liên tục N frame.
       * 2 là mức cân bằng tốt giữa tốc độ và độ chính xác.
       */
      const REQUIRED_STABLE_COUNT = 2;

      /*
       * ROI ở giữa camera.
       */
      const FAST_ROI_SCALE = 0.78;
      const HARD_ROI_SCALE = 0.98;

      /*
       * Giới hạn kích thước frame decode.
       */
      const FAST_MAX_SCAN_EDGE = 800;
      const HARD_MAX_SCAN_EDGE = 1100;

      /*
       * Ảnh upload tối đa.
       */
      const UPLOAD_MAX_EDGE = 1600;

      /*
       * Độ dài QR tối thiểu/tối đa để tránh dữ liệu bất thường.
       */
      const MIN_QR_LENGTH = 1;
      const MAX_QR_LENGTH = 2048;

      /*
       * Chỉ cảnh báo khi hình ảnh có đặc điểm giống QR nhưng không decode được.
       * Không có QR trong khung thì hoàn toàn im lặng.
       */
      const CANDIDATE_REQUIRED_FRAMES = 4;
      const CANDIDATE_WARN_AFTER_MS = 1200;
      const CANDIDATE_CLEAR_AFTER_MS = 500;
      const CANDIDATE_SAMPLE_SIZE = 96;

      // ============================================================
      // STATE
      // ============================================================

      let loopRunning = false;
      let loopTimer = null;
      let decoding = false;

      let mode = "fast";
      let scanStartedAt = 0;
      let lastSuccessAt = 0;
      let lastAttemptAt = 0;

      let lastEmittedText = "";
      let lastEmittedAt = 0;

      let stableText = "";
      let stableCount = 0;

      let candidateFrames = 0;
      let candidateStartedAt = 0;
      let lastCandidateAt = 0;
      let unreadableWarningSent = false;

      let canvas = null;
      let context = null;

      let qrReader = null;
      let browserQrReader = null;

      // ============================================================
      // EVENT BRIDGE
      // ============================================================

      function dispatchJsonEvent(eventName, payload) {
        try {
          const json = JSON.stringify(payload || {});

          window.dispatchEvent(
            new CustomEvent(eventName, {
              detail: json
            })
          );
        } catch (error) {
          console.error("[QR] dispatchJsonEvent error:", error);
        }
      }

      function dispatchCameraResult(text, error = "") {
        dispatchJsonEvent("qr-from-image", {
          text: String(text || ""),
          error: String(error || "")
        });
      }

      function dispatchUploadResult(text, error = "") {
        dispatchJsonEvent("qr-from-uploaded-image", {
          text: String(text || ""),
          error: String(error || "")
        });
      }

      function dispatchQrStatus(status, message = "") {
        dispatchJsonEvent("qr-scan-status", {
          status: String(status || ""),
          message: String(message || "")
        });
      }

      // ============================================================
      // HELPERS
      // ============================================================

      function now() {
        return Date.now();
      }

      function normalizeQr(value) {
        if (value === null || value === undefined) {
          return "";
        }

        return String(value).trim();
      }

      function isValidQrText(text) {
        return (
          text.length >= MIN_QR_LENGTH &&
          text.length <= MAX_QR_LENGTH
        );
      }

      function getVideoElement() {
        const video = document.getElementById("qr-video");

        if (!(video instanceof HTMLVideoElement)) {
          throw new Error("Video element #qr-video not found.");
        }

        if (!video.srcObject) {
          throw new Error("Camera stream is not ready.");
        }

        if (
          video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA ||
          video.videoWidth <= 0 ||
          video.videoHeight <= 0
        ) {
          throw new Error("Camera video is not ready.");
        }

        return video;
      }

      function ensureCanvas(width, height) {
        if (!canvas) {
          canvas = document.createElement("canvas");

          context = canvas.getContext("2d", {
            alpha: false,
            willReadFrequently: true
          });
        }

        if (!context) {
          throw new Error("Cannot create canvas context.");
        }

        if (canvas.width !== width) {
          canvas.width = width;
        }

        if (canvas.height !== height) {
          canvas.height = height;
        }

        return canvas;
      }

      function resizeInsideMaxEdge(width, height, maxEdge) {
        if (width <= 0 || height <= 0) {
          return {
            width: 0,
            height: 0
          };
        }

        const longest = Math.max(width, height);

        if (longest <= maxEdge) {
          return {
            width,
            height
          };
        }

        const scale = maxEdge / longest;

        return {
          width: Math.max(1, Math.round(width * scale)),
          height: Math.max(1, Math.round(height * scale))
        };
      }

      function getCropRect(videoWidth, videoHeight) {
        const roiScale =
          mode === "hard"
            ? HARD_ROI_SCALE
            : FAST_ROI_SCALE;

        const cropWidth = Math.max(
          1,
          Math.floor(videoWidth * roiScale)
        );

        const cropHeight = Math.max(
          1,
          Math.floor(videoHeight * roiScale)
        );

        return {
          sx: Math.floor((videoWidth - cropWidth) / 2),
          sy: Math.floor((videoHeight - cropHeight) / 2),
          sw: cropWidth,
          sh: cropHeight
        };
      }

      function currentInterval() {
        return mode === "hard"
          ? HARD_INTERVAL_MS
          : FAST_INTERVAL_MS;
      }

      function currentMaxScanEdge() {
        return mode === "hard"
          ? HARD_MAX_SCAN_EDGE
          : FAST_MAX_SCAN_EDGE;
      }

      function switchMode(nextMode) {
        if (nextMode !== "fast" && nextMode !== "hard") {
          return;
        }

        if (mode === nextMode) {
          return;
        }

        mode = nextMode;

        console.debug("[QR] mode =", mode);
      }

      // ============================================================
      // ZXING
      // ============================================================

      function getZxingLibrary() {
        const library = window.ZXing || globalThis.ZXing || null;

        if (
          library &&
          typeof library.QRCodeReader === "function"
        ) {
          return library;
        }

        return null;
      }

      function createHints(tryHarder) {
        const ZXingLib = getZxingLibrary();

        if (!ZXingLib) {
          return null;
        }

        try {
          const hints = new Map();

          if (
            ZXingLib.DecodeHintType?.POSSIBLE_FORMATS !== undefined &&
            ZXingLib.BarcodeFormat?.QR_CODE !== undefined
          ) {
            hints.set(
              ZXingLib.DecodeHintType.POSSIBLE_FORMATS,
              [ZXingLib.BarcodeFormat.QR_CODE]
            );
          }

          if (
            ZXingLib.DecodeHintType?.TRY_HARDER !== undefined
          ) {
            hints.set(
              ZXingLib.DecodeHintType.TRY_HARDER,
              Boolean(tryHarder)
            );
          }

          if (
            ZXingLib.DecodeHintType?.CHARACTER_SET !== undefined
          ) {
            hints.set(
              ZXingLib.DecodeHintType.CHARACTER_SET,
              "UTF-8"
            );
          }

          return hints;
        } catch (error) {
          console.warn("[QR] createHints error:", error);
          return null;
        }
      }

      function ensureReaders() {
        const ZXingLib = getZxingLibrary();

        if (!ZXingLib) {
          throw new Error(
            "ZXing library is not loaded. " +
            "Kiểm tra web/js/zxing.min.js và tên thư mục js."
          );
        }

        if (!qrReader) {
          qrReader = new ZXingLib.QRCodeReader();
        }

        /*
         * BrowserQRCodeReader chỉ là fallback.
         * Không tạo lại reader này ở mỗi frame.
         */
        if (
          !browserQrReader &&
          typeof ZXingLib.BrowserQRCodeReader === "function"
        ) {
          browserQrReader =
            new ZXingLib.BrowserQRCodeReader(null, 0);
        }
      }

      function resetReader() {
        try {
          qrReader?.reset?.();
        } catch (_) {}

        try {
          browserQrReader?.reset?.();
        } catch (_) {}
      }

      async function decodeCanvasWithZxing(
        targetCanvas,
        tryHarder
      ) {
        const ZXingLib = getZxingLibrary();

        if (!ZXingLib) {
          return "";
        }

        ensureReaders();

        /*
         * Ưu tiên QRCodeReader core để kiểm soát hints.
         */
        if (
          qrReader &&
          ZXingLib.HTMLCanvasElementLuminanceSource &&
          ZXingLib.BinaryBitmap &&
          ZXingLib.HybridBinarizer
        ) {
          try {
            const source =
              new ZXingLib.HTMLCanvasElementLuminanceSource(
                targetCanvas
              );

            const bitmap =
              new ZXingLib.BinaryBitmap(
                new ZXingLib.HybridBinarizer(source)
              );

            const hints = createHints(tryHarder);

            if (hints && qrReader.setHints) {
              qrReader.setHints(hints);
            }

            const result = qrReader.decode(
              bitmap,
              hints || undefined
            );

            const text = normalizeQr(
              result?.text ?? result?.getText?.()
            );

            if (isValidQrText(text)) {
              return text;
            }
          } catch (_) {
            /*
             * NotFoundException là bình thường.
             * Tiếp tục fallback.
             */
          } finally {
            try {
              qrReader.reset?.();
            } catch (_) {}
          }
        }

        /*
         * Fallback BrowserQRCodeReader.
         */
        if (browserQrReader) {
          try {
            const result =
              await browserQrReader.decodeFromCanvas(
                targetCanvas
              );

            const text = normalizeQr(
              result?.text ?? result?.getText?.()
            );

            if (isValidQrText(text)) {
              return text;
            }
          } catch (_) {
            // Không tìm thấy QR trong frame là trạng thái bình thường.
          }
        }

        return "";
      }

      function decodeCanvasWithJsQr(
        targetCanvas,
        inversionAttempts = "attemptBoth"
      ) {
        if (typeof window.jsQR !== "function") {
          return "";
        }

        try {
          const targetContext =
            targetCanvas.getContext("2d", {
              willReadFrequently: true
            });

          if (!targetContext) {
            return "";
          }

          const imageData =
            targetContext.getImageData(
              0,
              0,
              targetCanvas.width,
              targetCanvas.height
            );

          const result = window.jsQR(
            imageData.data,
            targetCanvas.width,
            targetCanvas.height,
            {
              inversionAttempts
            }
          );

          const text = normalizeQr(result?.data);

          return isValidQrText(text) ? text : "";
        } catch (_) {
          return "";
        }
      }

      // ============================================================
      // QR CANDIDATE HEURISTIC
      // ============================================================

      function resetCandidateState(notifyClear = false) {
        candidateFrames = 0;
        candidateStartedAt = 0;
        lastCandidateAt = 0;

        if (unreadableWarningSent && notifyClear) {
          dispatchQrStatus("clear", "");
        }

        unreadableWarningSent = false;
      }

      /*
       * Heuristic nhẹ:
       * - Thu nhỏ ROI để giảm CPU.
       * - Kiểm tra tỷ lệ pixel tối/sáng.
       * - Kiểm tra số lần chuyển tối↔sáng theo nhiều hàng/cột.
       *
       * Đây không phải decoder. Nó chỉ nhận biết "hình có vẻ giống QR"
       * để tránh báo lỗi khi người dùng chưa đưa QR vào camera.
       */
      function looksLikeQrCandidate(sourceCanvas) {
        try {
          const sample =
            document.createElement("canvas");

          sample.width = CANDIDATE_SAMPLE_SIZE;
          sample.height = CANDIDATE_SAMPLE_SIZE;

          const ctx =
            sample.getContext("2d", {
              alpha: false,
              willReadFrequently: true
            });

          if (!ctx) {
            return false;
          }

          ctx.drawImage(
            sourceCanvas,
            0,
            0,
            sourceCanvas.width,
            sourceCanvas.height,
            0,
            0,
            sample.width,
            sample.height
          );

          const imageData =
            ctx.getImageData(
              0,
              0,
              sample.width,
              sample.height
            );

          const pixels = imageData.data;
          const width = sample.width;
          const height = sample.height;

          let dark = 0;
          let light = 0;

          const grayAt = (x, y) => {
            const index = (y * width + x) * 4;

            return (
              pixels[index] * 0.299 +
              pixels[index + 1] * 0.587 +
              pixels[index + 2] * 0.114
            );
          };

          for (let y = 0; y < height; y += 2) {
            for (let x = 0; x < width; x += 2) {
              const gray = grayAt(x, y);

              if (gray < 75) {
                dark += 1;
              } else if (gray > 180) {
                light += 1;
              }
            }
          }

          const total = dark + light;

          if (total <= 0) {
            return false;
          }

          const darkRatio = dark / total;
          const lightRatio = light / total;

          /*
           * QR thường có cả vùng rất tối và rất sáng.
           */
          if (
            darkRatio < 0.10 ||
            darkRatio > 0.68 ||
            lightRatio < 0.18
          ) {
            return false;
          }

          let transitions = 0;
          let sampledLines = 0;

          const countTransitions = (values) => {
            let count = 0;
            let previous = values[0] < 128;

            for (let i = 1; i < values.length; i++) {
              const current = values[i] < 128;

              if (current !== previous) {
                count += 1;
                previous = current;
              }
            }

            return count;
          };

          /*
           * Lấy các hàng/cột quanh trung tâm.
           */
          for (const ratio of [0.25, 0.40, 0.50, 0.60, 0.75]) {
            const y =
              Math.min(
                height - 1,
                Math.max(0, Math.round(height * ratio))
              );

            const row = [];

            for (let x = 0; x < width; x += 2) {
              row.push(grayAt(x, y));
            }

            transitions += countTransitions(row);
            sampledLines += 1;

            const columnX =
              Math.min(
                width - 1,
                Math.max(0, Math.round(width * ratio))
              );

            const column = [];

            for (let rowY = 0; rowY < height; rowY += 2) {
              column.push(grayAt(columnX, rowY));
            }

            transitions += countTransitions(column);
            sampledLines += 1;
          }

          const averageTransitions =
            sampledLines > 0
              ? transitions / sampledLines
              : 0;

          return averageTransitions >= 7;
        } catch (_) {
          return false;
        }
      }

      function updateCandidateState(isCandidate) {
        const timestamp = now();

        if (!isCandidate) {
          if (
            lastCandidateAt > 0 &&
            timestamp - lastCandidateAt >
              CANDIDATE_CLEAR_AFTER_MS
          ) {
            resetCandidateState(true);
          }

          return;
        }

        lastCandidateAt = timestamp;
        candidateFrames += 1;

        if (
          candidateFrames < CANDIDATE_REQUIRED_FRAMES
        ) {
          return;
        }

        if (candidateStartedAt === 0) {
          candidateStartedAt = timestamp;
          dispatchQrStatus("reading", "");
          return;
        }

        if (
          !unreadableWarningSent &&
          timestamp - candidateStartedAt >=
            CANDIDATE_WARN_AFTER_MS
        ) {
          unreadableWarningSent = true;

          dispatchQrStatus(
            "unreadable",
            "Cannot read QR. Move closer, hold steady, or improve lighting."
          );
        }
      }

      // ============================================================
      // CAMERA FRAME DECODE
      // ============================================================

      async function decodeCameraFrame(video) {
        const videoWidth = video.videoWidth || 0;
        const videoHeight = video.videoHeight || 0;

        if (videoWidth <= 0 || videoHeight <= 0) {
          return {
            text: "",
            candidate: false
          };
        }

        const crop = getCropRect(
          videoWidth,
          videoHeight
        );

        const targetSize = resizeInsideMaxEdge(
          crop.sw,
          crop.sh,
          currentMaxScanEdge()
        );

        if (
          targetSize.width <= 0 ||
          targetSize.height <= 0
        ) {
          return {
            text: "",
            candidate: false
          };
        }

        const targetCanvas = ensureCanvas(
          targetSize.width,
          targetSize.height
        );

        context.save();

        try {
          context.fillStyle = "#ffffff";
          context.fillRect(
            0,
            0,
            targetCanvas.width,
            targetCanvas.height
          );

          context.drawImage(
            video,
            crop.sx,
            crop.sy,
            crop.sw,
            crop.sh,
            0,
            0,
            targetCanvas.width,
            targetCanvas.height
          );
        } finally {
          context.restore();
        }

        const zxingText =
          await decodeCanvasWithZxing(
            targetCanvas,
            mode === "hard"
          );

        if (zxingText) {
          return {
            text: zxingText,
            candidate: true
          };
        }

        if (mode === "hard") {
          const jsQrText =
            decodeCanvasWithJsQr(
              targetCanvas,
              "attemptBoth"
            );

          if (jsQrText) {
            return {
              text: jsQrText,
              candidate: true
            };
          }
        }

        return {
          text: "",
          candidate:
            mode === "hard" &&
            looksLikeQrCandidate(targetCanvas)
        };
      }

      // ============================================================
      // STABILITY + DEDUPE
      // ============================================================

      function resetStability() {
        stableText = "";
        stableCount = 0;
      }

      function acceptStableText(text) {
        if (!text) {
          resetStability();
          return false;
        }

        if (stableText === text) {
          stableCount += 1;
        } else {
          stableText = text;
          stableCount = 1;
        }

        return stableCount >= REQUIRED_STABLE_COUNT;
      }

      function shouldEmit(text) {
        const timestamp = now();

        if (
          text === lastEmittedText &&
          timestamp - lastEmittedAt <
            DUPLICATE_COOLDOWN_MS
        ) {
          return false;
        }

        return true;
      }

      function emitDetectedQr(text) {
        const normalized = normalizeQr(text);

        if (!isValidQrText(normalized)) {
          return;
        }

        if (!acceptStableText(normalized)) {
          return;
        }

        if (!shouldEmit(normalized)) {
          return;
        }

        const timestamp = now();

        lastEmittedText = normalized;
        lastEmittedAt = timestamp;
        lastSuccessAt = timestamp;

        resetStability();
        resetCandidateState(true);

        /*
         * Thành công chỉ gửi QR về Flutter.
         * Không gửi banner "detected".
         */
        dispatchCameraResult(normalized, "");

        /*
         * Sau khi thành công, quay về fast mode.
         */
        if (mode === "hard") {
          window.setTimeout(() => {
            if (loopRunning) {
              switchMode("fast");
              scanStartedAt = now();
            }
          }, HARD_SUCCESS_HOLD_MS);
        }
      }

      // ============================================================
      // ADAPTIVE MODE
      // ============================================================

      function updateAdaptiveMode() {
        const timestamp = now();

        const referenceTime =
          lastSuccessAt > 0
            ? lastSuccessAt
            : scanStartedAt;

        if (
          mode === "fast" &&
          timestamp - referenceTime >
            SWITCH_TO_HARD_AFTER_MS
        ) {
          switchMode("hard");
        }
      }

      // ============================================================
      // LOOP
      // ============================================================

      function scheduleNext(video, delayMs = null) {
        if (!loopRunning) {
          return;
        }

        if (loopTimer !== null) {
          clearTimeout(loopTimer);
        }

        loopTimer = window.setTimeout(
          () => loopTick(video),
          delayMs ?? currentInterval()
        );
      }

      async function loopTick(video) {
        if (!loopRunning || decoding) {
          return;
        }

        /*
         * Flutter có thể thay video element sau sleep/wake.
         */
        let activeVideo = video;
        const currentVideo =
          document.getElementById("qr-video");

        if (currentVideo instanceof HTMLVideoElement) {
          activeVideo = currentVideo;
        }

        if (
          !activeVideo ||
          !activeVideo.srcObject ||
          activeVideo.videoWidth <= 0 ||
          activeVideo.videoHeight <= 0
        ) {
          scheduleNext(activeVideo, 250);
          return;
        }

        decoding = true;

        try {
          updateAdaptiveMode();

          const result =
            await decodeCameraFrame(activeVideo);

          if (result.text) {
            emitDetectedQr(result.text);
          } else {
            updateCandidateState(
              Boolean(result.candidate)
            );

            if (stableCount > 0) {
              stableCount = Math.max(
                0,
                stableCount - 1
              );

              if (stableCount === 0) {
                stableText = "";
              }
            }
          }
        } catch (error) {
          console.warn("[QR] loop decode error:", error);
        } finally {
          decoding = false;
          scheduleNext(activeVideo);
        }
      }

      // ============================================================
      // PUBLIC CAMERA API
      // ============================================================

      window.startQrLoop = function () {
        try {
          if (loopRunning) {
            return;
          }

          ensureReaders();

          const video = getVideoElement();

          loopRunning = true;
          decoding = false;

          mode = "fast";
          scanStartedAt = now();
          lastSuccessAt = 0;
          lastAttemptAt = 0;

          lastEmittedText = "";
          lastEmittedAt = 0;

          resetStability();
          resetCandidateState(false);

          console.info(
            "[QR] scanner started:",
            video.videoWidth,
            "x",
            video.videoHeight
          );

          scheduleNext(video, 0);
        } catch (error) {
          loopRunning = false;

          const message =
            String(error?.message || error);

          console.error(
            "[QR] startQrLoop error:",
            error
          );

          dispatchCameraResult("", message);
        }
      };

      window.stopQrLoop = function () {
        loopRunning = false;
        decoding = false;

        if (loopTimer !== null) {
          clearTimeout(loopTimer);
          loopTimer = null;
        }

        resetStability();
        resetCandidateState(true);
        resetReader();

        console.info("[QR] scanner stopped");
      };

      // ============================================================
      // IMAGE HELPERS
      // ============================================================

      function loadImage(objectUrl) {
        return new Promise((resolve, reject) => {
          const image = new Image();

          image.onload = () => resolve(image);

          image.onerror = () => {
            reject(
              new Error("Failed to load image.")
            );
          };

          image.src = objectUrl;
        });
      }

      function createCanvasFromImage(
        image,
        maxEdge
      ) {
        const sourceWidth =
          image.naturalWidth ||
          image.width ||
          0;

        const sourceHeight =
          image.naturalHeight ||
          image.height ||
          0;

        if (
          sourceWidth <= 0 ||
          sourceHeight <= 0
        ) {
          throw new Error("Invalid image size.");
        }

        const targetSize = resizeInsideMaxEdge(
          sourceWidth,
          sourceHeight,
          maxEdge
        );

        const output =
          document.createElement("canvas");

        output.width = targetSize.width;
        output.height = targetSize.height;

        const outputContext =
          output.getContext("2d", {
            alpha: false,
            willReadFrequently: true
          });

        if (!outputContext) {
          throw new Error(
            "Cannot create image canvas."
          );
        }

        outputContext.fillStyle = "#ffffff";
        outputContext.fillRect(
          0,
          0,
          output.width,
          output.height
        );

        outputContext.drawImage(
          image,
          0,
          0,
          sourceWidth,
          sourceHeight,
          0,
          0,
          output.width,
          output.height
        );

        return output;
      }

      function createGrayscaleCanvas(sourceCanvas) {
        const output =
          document.createElement("canvas");

        output.width = sourceCanvas.width;
        output.height = sourceCanvas.height;

        const outputContext =
          output.getContext("2d", {
            alpha: false,
            willReadFrequently: true
          });

        if (!outputContext) {
          return null;
        }

        outputContext.drawImage(
          sourceCanvas,
          0,
          0
        );

        const imageData =
          outputContext.getImageData(
            0,
            0,
            output.width,
            output.height
          );

        const pixels = imageData.data;

        for (
          let index = 0;
          index < pixels.length;
          index += 4
        ) {
          const gray = Math.round(
            pixels[index] * 0.299 +
            pixels[index + 1] * 0.587 +
            pixels[index + 2] * 0.114
          );

          pixels[index] = gray;
          pixels[index + 1] = gray;
          pixels[index + 2] = gray;
        }

        outputContext.putImageData(
          imageData,
          0,
          0
        );

        return output;
      }

      function createHighContrastCanvas(
        sourceCanvas
      ) {
        const output =
          document.createElement("canvas");

        output.width = sourceCanvas.width;
        output.height = sourceCanvas.height;

        const outputContext =
          output.getContext("2d", {
            alpha: false,
            willReadFrequently: true
          });

        if (!outputContext) {
          return null;
        }

        outputContext.drawImage(
          sourceCanvas,
          0,
          0
        );

        const imageData =
          outputContext.getImageData(
            0,
            0,
            output.width,
            output.height
          );

        const pixels = imageData.data;

        /*
         * Contrast đơn giản, nhẹ hơn OpenCV.
         */
        const contrast = 1.45;
        const midpoint = 128;

        for (
          let index = 0;
          index < pixels.length;
          index += 4
        ) {
          const gray = Math.round(
            pixels[index] * 0.299 +
            pixels[index + 1] * 0.587 +
            pixels[index + 2] * 0.114
          );

          const adjusted = Math.max(
            0,
            Math.min(
              255,
              Math.round(
                (gray - midpoint) * contrast +
                midpoint
              )
            )
          );

          pixels[index] = adjusted;
          pixels[index + 1] = adjusted;
          pixels[index + 2] = adjusted;
        }

        outputContext.putImageData(
          imageData,
          0,
          0
        );

        return output;
      }

      function createCenterCropCanvas(
        sourceCanvas,
        scale = 0.82
      ) {
        const sourceWidth = sourceCanvas.width;
        const sourceHeight = sourceCanvas.height;

        const cropWidth =
          Math.max(
            1,
            Math.round(sourceWidth * scale)
          );

        const cropHeight =
          Math.max(
            1,
            Math.round(sourceHeight * scale)
          );

        const sx =
          Math.round(
            (sourceWidth - cropWidth) / 2
          );

        const sy =
          Math.round(
            (sourceHeight - cropHeight) / 2
          );

        const output =
          document.createElement("canvas");

        output.width = cropWidth;
        output.height = cropHeight;

        const outputContext =
          output.getContext("2d", {
            alpha: false,
            willReadFrequently: true
          });

        if (!outputContext) {
          return null;
        }

        outputContext.drawImage(
          sourceCanvas,
          sx,
          sy,
          cropWidth,
          cropHeight,
          0,
          0,
          cropWidth,
          cropHeight
        );

        return output;
      }

      async function decodeUploadedCanvas(
        targetCanvas
      ) {
        let text = "";

        /*
         * Pass 1: ZXing original.
         */
        text =
          await decodeCanvasWithZxing(
            targetCanvas,
            true
          );

        if (text) {
          return text;
        }

        /*
         * Pass 2: jsQR original.
         */
        text =
          decodeCanvasWithJsQr(
            targetCanvas,
            "attemptBoth"
          );

        if (text) {
          return text;
        }

        /*
         * Pass 3: center crop.
         */
        const centerCanvas =
          createCenterCropCanvas(
            targetCanvas,
            0.84
          );

        if (centerCanvas) {
          text =
            await decodeCanvasWithZxing(
              centerCanvas,
              true
            );

          if (text) {
            return text;
          }

          text =
            decodeCanvasWithJsQr(
              centerCanvas,
              "attemptBoth"
            );

          if (text) {
            return text;
          }
        }

        /*
         * Pass 4: grayscale.
         */
        const grayCanvas =
          createGrayscaleCanvas(
            targetCanvas
          );

        if (grayCanvas) {
          text =
            await decodeCanvasWithZxing(
              grayCanvas,
              true
            );

          if (text) {
            return text;
          }

          text =
            decodeCanvasWithJsQr(
              grayCanvas,
              "attemptBoth"
            );

          if (text) {
            return text;
          }
        }

        /*
         * Pass 5: high contrast.
         */
        const contrastCanvas =
          createHighContrastCanvas(
            targetCanvas
          );

        if (contrastCanvas) {
          text =
            await decodeCanvasWithZxing(
              contrastCanvas,
              true
            );

          if (text) {
            return text;
          }

          text =
            decodeCanvasWithJsQr(
              contrastCanvas,
              "attemptBoth"
            );

          if (text) {
            return text;
          }
        }

        return "";
      }

      // ============================================================
      // PUBLIC IMAGE API
      // ============================================================

      window.decodeQrFromImageBytes =
        async function (objectUrl) {
          try {
            if (!objectUrl) {
              throw new Error(
                "Image URL is empty."
              );
            }

            ensureReaders();

            const image =
              await loadImage(objectUrl);

            const imageCanvas =
              createCanvasFromImage(
                image,
                UPLOAD_MAX_EDGE
              );

            const text =
              await decodeUploadedCanvas(
                imageCanvas
              );

            if (text) {
              dispatchUploadResult(text, "");
            } else {
              dispatchUploadResult(
                "",
                "No QR code found in image."
              );
            }
          } catch (error) {
            console.error(
              "[QR-UPLOAD] decode error:",
              error
            );

            dispatchUploadResult(
              "",
              String(error?.message || error)
            );
          }
        };

      console.info(
        "[QR] scanner script loaded",
        "| ZXing:", typeof window.ZXing,
        "| jsQR:", typeof window.jsQR
      );
    })();
</script>


<script src="flutter_bootstrap.js"></script>
